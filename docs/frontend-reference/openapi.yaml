  /admin/categories/{id}:
    put:
      summary: '[ADMIN] Full-replace update a category'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryDto' } } } }
      responses:
        '200': { description: OK }
