    delete:
      summary: '[ADMIN] Soft-delete a category'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: No Content }
        '404': { description: Not found }
        '409': { description: Category still has menu items }
  /admin/menu:
    get:
      summary: '[ADMIN] List all menu items (incl. unavailable)'
      parameters:
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminMenuItemResponseDto' } } } } } }
  /admin/menu/items:
    post:
      summary: '[ADMIN] Create a menu item'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MenuItemDto' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AdminMenuItemResponseDto' } } } }
        '422': { description: Invalid category }
  /admin/menu/items/{id}:
    put:
      summary: '[ADMIN] Full-replace update a menu item (incl. variants/addonGroups sync)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MenuItemDto' } } } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
        '409': { description: Entity in use by an active cart }
        '422': { description: Invalid association }
    delete:
      summary: '[ADMIN] Soft-delete a menu item'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: No Content }
        '404': { description: Not found }
  /admin/menu/items/{id}/availability:
    patch:
      summary: '[ADMIN] Toggle a menu item''s availability'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetAvailabilityDto' } } } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /settings:
    get:
      summary: Public restaurant settings
      security: []
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublicSettingsResponseDto' } } } } }
  /admin/settings:
    get:
      summary: '[ADMIN] Full restaurant settings'
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSettingsResponseDto' } } } } }
    put:
      summary: '[ADMIN] Full-replace update restaurant settings'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateSettingsDto' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSettingsResponseDto' } } } } }
  /cart:
    get:
      summary: Get the caller's cart (created lazily if none exists)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponseDto' } } } } }
    delete:
      summary: Clear all items from the cart
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponseDto' } } } } }
  /cart/items:
    post:
      summary: Add an item to the cart
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddCartItemDto' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponseDto' } } } }
        '404': { description: Item unavailable }
        '422': { description: Invalid variant/addon selection }
  /cart/items/{id}:
    put:
      summary: Update a cart line (merge-patch)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCartItemDto' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponseDto' } } } }
        '404': { description: Cart item not found }
    delete:
      summary: Remove a cart line
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponseDto' } } } }
        '404': { description: Cart item not found }
  /cart/apply-promo:
    post:
      summary: Apply a promo code to the cart
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ApplyPromoDto' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponseDto' } } } }
        '404': { description: Promo not found }
        '422': { description: Promo invalid/expired/min-order not met }
  /cart/promo:
    delete:
      summary: Remove the applied promo from the cart
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponseDto' } } } } }
  /promos/validate:
    post:
      summary: Validate a promo code against the caller's live cart (does not apply it)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ValidatePromoDto' } } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  discountType: { type: string }
                  value: { type: number }
                  computedDiscount: { type: number }
        '404': { description: Promo not found }
        '422': { description: Promo invalid/expired/min-order not met }
  /admin/promos:
    get:
      summary: '[ADMIN] List promo codes'
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminPromoResponseDto' } } } } } }
    post:
      summary: '[ADMIN] Create a promo code'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PromoDto' } } } }
      responses:
        '201': { description: Created }
        '409': { description: Code already exists }
  /admin/promos/{id}:
    put:
      summary: '[ADMIN] Full-replace update a promo code'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PromoDto' } } } }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
        '409': { description: Code already exists }
    delete:
      summary: '[ADMIN] Soft-delete a promo code'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: No Content }
        '404': { description: Not found }
  /checkout:
    post:
      summary: '[CUSTOMER] Convert the cart into an order (canonical path)'
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutDto' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponseDto' } } } }
        '403': { description: 'Guest account attempted to redeemRewardId (GUEST_NOT_ELIGIBLE)' }
        '404': { description: Unknown redeemRewardId }
        '409': { description: Cart is empty }
        '422': { description: 'Below minimum order / address required / item, promo, or loyalty reward invalid / promoCode and redeemRewardId both sent (PROMO_AND_LOYALTY_MUTUALLY_EXCLUSIVE)' }
  /orders:
    post:
      summary: '[CUSTOMER] Alias of /checkout (same handler)'
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutDto' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponseDto' } } } } }
    get:
      summary: List the caller's own orders
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, confirmed, preparing, outForDelivery, delivered, cancelled] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderResponseDto' } } } } } }
  /orders/{id}:
    get:
      summary: Get one of the caller's own orders
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponseDto' } } } }
        '404': { description: Not found }
  /orders/{id}/status:
    get:
      summary: Get status + full history for one of the caller's own orders
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderStatusResponseDto' } } } }
        '404': { description: Not found }
  /admin/orders:
    get:
      summary: '[ADMIN] List every order'
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderResponseDto' } } } } } }
  /admin/orders/{id}:
    get:
      summary: '[ADMIN] Get any order by id'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponseDto' } } } }
        '404': { description: Not found }
  /admin/orders/{id}/status:
    patch:
      summary: '[ADMIN] Transition an order''s status'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOrderStatusDto' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OrderResponseDto' } } } }
        '404': { description: Not found }
        '422': { description: Invalid status transition — see 05_ORDER_LIFECYCLE.md }
  /payments/intent:
    post:
      summary: '[CUSTOMER] Create/fetch a payment intent for an order (CASH only works)'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateIntentDto' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentIntentResponseDto' } } } }
        '404': { description: Order or payment not found }
        '409': { description: Payment already processed }
        '501': { description: 'Payment provider not configured (CARD/WALLET)' }
  /payments/{id}:
    get:
      summary: Get a payment by id (owner or ADMIN)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponseDto' } } } }
        '404': { description: Not found }
  /payments/webhook:
    post:
      summary: Gateway webhook receiver (not frontend-relevant)
      security: []
      parameters: [{ name: provider, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: Received }
        '400': { description: Unknown provider or invalid signature }
        '404': { description: Payment not found for providerRef }
  /devices/register:
    post:
      summary: Register/refresh an FCM device token
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterDeviceDto' } } } }
      responses: { '201': { description: Created } }
  /devices/token:
    put:
      summary: Move a device token from oldToken to a new token value
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateDeviceTokenDto' } } } }
      responses:
        '200': { description: OK }
        '404': { description: Device token not found }
    delete:
      summary: Remove a device token (logout on this device)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteDeviceTokenDto' } } } }
      responses:
        '204': { description: No Content }
        '404': { description: Device token not found }
  /me/addresses:
    get:
      summary: List the caller's saved addresses
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AddressResponseDto' } } } } } }
    post:
      summary: Create a saved address
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressDto' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AddressResponseDto' } } } } }
  /me/addresses/{id}:
    put:
      summary: Full-replace update a saved address
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressDto' } } } }
      responses:
        '200': { description: OK }
        '403': { description: Belongs to another user }
        '404': { description: Not found }
    delete:
      summary: Delete a saved address
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: No Content }
        '403': { description: Belongs to another user }
        '404': { description: Not found }
  /me/addresses/{id}/default:
    patch:
      summary: Set a saved address as the default (clears default on all others)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK }
        '403': { description: Belongs to another user }
        '404': { description: Not found }
  /me/favorites:
    get:
      summary: '[CUSTOMER] List favorite menu items'
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MenuItemResponseDto' } } } } } }
    post:
      summary: '[CUSTOMER] Add a menu item to favorites'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddFavoriteDto' } } } }
      responses:
        '201': { description: 'Created — returns the full updated favorites array', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MenuItemResponseDto' } } } } }
        '404': { description: Menu item not found }
        '409': { description: Already a favorite }
  /me/favorites/{menuItemId}:
    delete:
      summary: '[CUSTOMER] Remove a menu item from favorites'
      parameters: [{ name: menuItemId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: No Content }
        '404': { description: Not a favorite }
  /me/loyalty:
    get:
      summary: '[CUSTOMER, non-guest] Get loyalty account balance'
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoyaltyAccountResponseDto' } } } } }
  /me/loyalty/transactions:
    get:
      summary: '[CUSTOMER, non-guest] List loyalty ledger transactions'
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LoyaltyTransactionResponseDto' } } } } } }
  /me/loyalty/redeem:
    post:
      summary: '[CUSTOMER, non-guest] LEGACY/manual redemption — standalone, no order link, no atomicity guarantee. Prefer CheckoutDto.redeemRewardId.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RedeemDto' } } } }
      responses:
        '201': { description: Created }
        '404': { description: Unknown reward }
        '422': { description: Insufficient points }
  /admin/notifications/send:
    post:
      summary: '[ADMIN] Send a push notification campaign immediately'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignDto' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AdminCampaignResponseDto' } } } } }
  /admin/notifications/schedule:
    post:
      summary: '[ADMIN] Schedule a push notification campaign for later'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleCampaignDto' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AdminCampaignResponseDto' } } } } }
  /admin/notifications/campaigns:
    get:
      summary: '[ADMIN] List notification campaigns'
      parameters: [{ name: page, in: query, schema: { type: integer, default: 1 } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminCampaignResponseDto' } } } } } }
  /admin/notifications/campaigns/{id}:
    delete:
      summary: '[ADMIN] Delete a DRAFT or SCHEDULED campaign'
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: No Content }
        '404': { description: Not found }
        '409': { description: Not deletable (already sent/sending/failed) }
  /admin/uploads/image:
    post:
      summary: '[ADMIN] Upload an image, get back a public URL'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/UploadImageResponseDto' } } } }
        '400': { description: 'Invalid file type or no file provided' }
        '413': { description: File too large }
  /health:
    get:
      summary: Liveness probe
      security: []
      responses: { '200': { description: OK } }
  /health/ready:
    get:
      summary: Readiness probe (includes a real DB ping)
      security: []
      responses:
        '200': { description: OK }
        '503': { description: Database unreachable }
