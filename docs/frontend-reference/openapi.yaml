openapi: 3.0.3
info:
  title: Kebda Zaman API
  version: "0.1.0"
  description: >
    Hand-authored directly from the NestJS source (no @nestjs/swagger is installed in this
    backend, so this could not be tool-generated from decorators — see the final report in the
    conversation that produced this doc set). Every path, DTO, and status code below was verified
    against the actual controller/DTO/service source, not invented. Base server path is /api/v1.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message: { type: string }
        code: { type: string }
        details: { type: array, items: {} }
        timestamp: { type: string, format: date-time }
        path: { type: string }
        requestId: { type: string }
      required: [statusCode, error, message, code, timestamp, path]
    UserResponseDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [CUSTOMER, ADMIN] }
        isGuest: { type: boolean }
        locale: { type: string }
        createdAt: { type: string, format: date-time }
    AuthResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/UserResponseDto' }
        accessToken: { type: string }
        refreshToken: { type: string }
    RegisterDto:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 72 }
        phone: { type: string, maxLength: 30 }
    LoginDto:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 1, maxLength: 72 }
    RefreshDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutDto:
      type: object
      properties:
        refreshToken: { type: string }
    GuestDto:
      type: object
      properties:
        deviceId: { type: string, maxLength: 200 }
    UpdateProfileDto:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, maxLength: 30 }
        avatarUrl: { type: string, maxLength: 2048 }
        locale: { type: string, enum: [ar, en] }
    CategoryDto:
      type: object
      required: [nameAr, nameEn]
      properties:
        nameAr: { type: string, maxLength: 100 }
        nameEn: { type: string, maxLength: 100 }
        iconUrl: { type: string, maxLength: 2048 }
        displayOrder: { type: integer, minimum: 0 }
    CategoryResponseDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        nameAr: { type: string }
        nameEn: { type: string }
        iconUrl: { type: string, nullable: true }
        displayOrder: { type: integer }
    AdminCategoryResponseDto:
      allOf:
        - $ref: '#/components/schemas/CategoryResponseDto'
        - type: object
          properties:
            isActive: { type: boolean }
    VariantDto:
      type: object
      required: [nameAr, nameEn, priceDelta]
      properties:
        id: { type: string, format: uuid }
        nameAr: { type: string, maxLength: 100 }
        nameEn: { type: string, maxLength: 100 }
        priceDelta: { type: number }
        isDefault: { type: boolean }
        isActive: { type: boolean }
        displayOrder: { type: integer, minimum: 0 }
    AddonDto:
      type: object
      required: [nameAr, nameEn, price]
      properties:
        id: { type: string, format: uuid }
        nameAr: { type: string, maxLength: 100 }
        nameEn: { type: string, maxLength: 100 }
        price: { type: number, minimum: 0 }
        isAvailable: { type: boolean }
        displayOrder: { type: integer, minimum: 0 }
    AddonGroupDto:
      type: object
      required: [titleAr, titleEn, addons]
      properties:
        id: { type: string, format: uuid }
        titleAr: { type: string, maxLength: 100 }
        titleEn: { type: string, maxLength: 100 }
        isRequired: { type: boolean }
        minSelect: { type: integer, minimum: 0 }
        maxSelect: { type: integer, minimum: 0 }
        displayOrder: { type: integer, minimum: 0 }
        addons:
          type: array
          items: { $ref: '#/components/schemas/AddonDto' }
    MenuItemDto:
      type: object
      required: [categoryId, nameAr, nameEn, descriptionAr, descriptionEn, basePrice]
      properties:
        categoryId: { type: string, format: uuid }
        nameAr: { type: string, maxLength: 150 }
        nameEn: { type: string, maxLength: 150 }
        descriptionAr: { type: string }
        descriptionEn: { type: string }
        basePrice: { type: number, minimum: 0 }
        imageUrl: { type: string, maxLength: 2048, nullable: true }
        isAvailable: { type: boolean }
        isPopular: { type: boolean }
        displayOrder: { type: integer, minimum: 0 }
        variants:
          type: array
          items: { $ref: '#/components/schemas/VariantDto' }
        addonGroups:
          type: array
          items: { $ref: '#/components/schemas/AddonGroupDto' }
    ItemVariantResponseDto:
      type: object
      properties:
        id: { type: string }
        nameAr: { type: string }
        nameEn: { type: string }
        priceDelta: { type: number }
        isDefault: { type: boolean }
    AddonResponseDto:
      type: object
      properties:
        id: { type: string }
        nameAr: { type: string }
        nameEn: { type: string }
        price: { type: number }
    AddonGroupResponseDto:
      type: object
      properties:
        id: { type: string }
        titleAr: { type: string }
        titleEn: { type: string }
        isRequired: { type: boolean }
        minSelect: { type: integer }
        maxSelect: { type: integer }
        addons:
          type: array
          items: { $ref: '#/components/schemas/AddonResponseDto' }
    MenuItemResponseDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        nameAr: { type: string }
        nameEn: { type: string }
        descriptionAr: { type: string }
        descriptionEn: { type: string }
        basePrice: { type: number }
        imageUrl: { type: string, nullable: true }
        isAvailable: { type: boolean }
        isPopular: { type: boolean }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ItemVariantResponseDto' }
        addonGroups:
          type: array
          items: { $ref: '#/components/schemas/AddonGroupResponseDto' }
    AdminMenuItemResponseDto:
      allOf:
        - $ref: '#/components/schemas/MenuItemResponseDto'
        - type: object
          properties:
            displayOrder: { type: integer, nullable: true }
    SetAvailabilityDto:
      type: object
      required: [isAvailable]
      properties:
        isAvailable: { type: boolean }
    WorkingHoursDto:
      type: object
      required: [open, close]
      properties:
        open: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        close: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
    UpdateSettingsDto:
      type: object
      required: [restaurantName, phone, addressText, taxRatePercent, deliveryFee, minOrderAmount, currency, workingHours, isMaintenanceMode]
      properties:
        restaurantName: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 50 }
        addressText: { type: string, maxLength: 500 }
        taxRatePercent: { type: number, minimum: 0, maximum: 100 }
        deliveryFee: { type: number, minimum: 0 }
        minOrderAmount: { type: number, minimum: 0 }
        currency: { type: string, maxLength: 10 }
        workingHours: { $ref: '#/components/schemas/WorkingHoursDto' }
        isMaintenanceMode: { type: boolean }
    PublicSettingsResponseDto:
      type: object
      properties:
        deliveryFee: { type: number }
        taxRatePercent: { type: number }
        minOrderAmount: { type: number }
        workingHours: {}
        isMaintenanceMode: { type: boolean }
    AdminSettingsResponseDto:
      allOf:
        - $ref: '#/components/schemas/PublicSettingsResponseDto'
        - type: object
          properties:
            id: { type: string }
            restaurantName: { type: string }
            phone: { type: string }
            addressText: { type: string }
            currency: { type: string }
            updatedAt: { type: string, format: date-time }
    AddCartItemDto:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        addonIds: { type: array, items: { type: string, format: uuid } }
        quantity: { type: integer, minimum: 1 }
        specialInstructions: { type: string, maxLength: 500 }
    UpdateCartItemDto:
      type: object
      properties:
        quantity: { type: integer, minimum: 1 }
        variantId: { type: string, format: uuid, nullable: true }
        addonIds: { type: array, items: { type: string, format: uuid } }
        specialInstructions: { type: string, maxLength: 500, nullable: true }
    ApplyPromoDto:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 50 }
    PromoResponseDto:
      type: object
      properties:
        code: { type: string }
        discountType: { type: string, enum: [PERCENT, FIXED] }
        value: { type: number }
        minOrderAmount: { type: number, nullable: true }
        maxDiscountAmount: { type: number, nullable: true }
    AdminPromoResponseDto:
      allOf:
        - $ref: '#/components/schemas/PromoResponseDto'
        - type: object
          properties:
            id: { type: string }
            maxUsage: { type: integer, nullable: true }
            usageCount: { type: integer }
            perUserLimit: { type: integer, nullable: true }
            startsAt: { type: string, nullable: true }
            expiresAt: { type: string, nullable: true }
            isActive: { type: boolean }
            createdAt: { type: string }
            updatedAt: { type: string }
    PromoDto:
      type: object
      required: [code, discountType, value]
      properties:
        code: { type: string, maxLength: 50 }
        discountType: { type: string, enum: [PERCENT, FIXED] }
        value: { type: number, minimum: 0 }
        minOrderAmount: { type: number, minimum: 0 }
        maxDiscountAmount: { type: number, minimum: 0 }
        maxUsage: { type: integer, minimum: 1 }
        perUserLimit: { type: integer, minimum: 1 }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        isActive: { type: boolean }
    ValidatePromoDto:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 50 }
        subtotal: { type: number, description: "accepted but ignored server-side" }
    CartItemResponseDto:
      type: object
      properties:
        id: { type: string }
        menuItem: { $ref: '#/components/schemas/MenuItemResponseDto' }
        selectedVariant: { $ref: '#/components/schemas/ItemVariantResponseDto' }
        selectedAddons:
          type: array
          items: { $ref: '#/components/schemas/AddonResponseDto' }
        quantity: { type: integer }
        specialInstructions: { type: string, nullable: true }
        unitPrice: { type: number }
        totalPrice: { type: number }
        isAvailable: { type: boolean }
    CartResponseDto:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItemResponseDto' }
        appliedPromo:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/PromoResponseDto' }]
        deliveryFee: { type: number }
        taxRate: { type: number }
    DeliveryAddressDto:
      type: object
      required: [title, street, building, city]
      properties:
        title: { type: string, maxLength: 100 }
        street: { type: string, maxLength: 200 }
        building: { type: string, maxLength: 100 }
        floor: { type: string, maxLength: 50 }
        apartment: { type: string, maxLength: 50 }
        city: { type: string, maxLength: 100 }
    CheckoutDto:
      type: object
      required: [deliveryMethod, paymentMethod]
      properties:
        deliveryMethod: { type: string, enum: [DELIVERY, PICKUP] }
        paymentMethod: { type: string, enum: [CASH, CARD, WALLET] }
        deliveryAddress: { $ref: '#/components/schemas/DeliveryAddressDto' }
        promoCode: { type: string, maxLength: 50, description: 'Mutually exclusive with redeemRewardId' }
        redeemRewardId: { type: string, maxLength: 50, description: 'One of the fixed loyalty reward ids; mutually exclusive with promoCode; redeemed atomically in the checkout transaction' }
        notes: { type: string, maxLength: 1000 }
    OrderItemResponseDto:
      type: object
      properties:
        id: { type: string }
        menuItem:
          type: object
          properties:
            nameAr: { type: string }
            nameEn: { type: string }
            imageUrl: { type: string, nullable: true }
        selectedVariant:
          type: object
          nullable: true
          properties:
            id: { type: string }
            nameAr: { type: string }
            nameEn: { type: string }
            priceSnapshot: { type: number }
        selectedAddons:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              nameAr: { type: string }
              nameEn: { type: string }
              priceSnapshot: { type: number }
        quantity: { type: integer }
        specialInstructions: { type: string, nullable: true }
        unitPrice: { type: number }
        totalPrice: { type: number }
    OrderResponseDto:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string }
        userId: { type: string }
        user: { $ref: '#/components/schemas/UserResponseDto' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemResponseDto' }
        status: { type: string, enum: [pending, confirmed, preparing, outForDelivery, delivered, cancelled] }
        deliveryAddress: {}
        paymentMethod: { type: string, enum: [cash, card, wallet] }
        subtotal: { type: number }
        deliveryFee: { type: number }
        tax: { type: number }
        discount: { type: number }
        totalAmount: { type: number }
        createdAt: { type: string, format: date-time }
        estimatedDeliveryTime: { type: string, nullable: true, format: date-time }
        loyaltyRedemption:
          type: object
          nullable: true
          properties:
            rewardId: { type: string }
            rewardName: { type: string }
            pointsRedeemed: { type: integer }
    OrderStatusResponseDto:
      type: object
      properties:
        status: { type: string }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              note: { type: string, nullable: true }
              changedAt: { type: string, format: date-time }
        estimatedDeliveryTime: { type: string, nullable: true }
    UpdateOrderStatusDto:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, confirmed, preparing, outForDelivery, delivered, cancelled] }
        note: { type: string, maxLength: 1000 }
    CreateIntentDto:
      type: object
      required: [orderId]
      properties:
        orderId: { type: string, format: uuid }
    PaymentResponseDto:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        method: { type: string }
        status: { type: string, enum: [PENDING, PAID, FAILED, REFUNDED] }
        amount: { type: number }
        currency: { type: string }
        provider: { type: string, nullable: true }
        providerRef: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
    PaymentIntentResponseDto:
      type: object
      properties:
        paymentId: { type: string }
        status: { type: string }
        providerData: { type: object }
    RegisterDeviceDto:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, maxLength: 4096 }
        platform: { type: string, enum: [ANDROID, IOS, WEB, MACOS, WINDOWS] }
    UpdateDeviceTokenDto:
      type: object
      required: [token, platform]
      properties:
        oldToken: { type: string, maxLength: 4096 }
        token: { type: string, maxLength: 4096 }
        platform: { type: string, enum: [ANDROID, IOS, WEB, MACOS, WINDOWS] }
    DeleteDeviceTokenDto:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 4096 }
    AddressDto:
      type: object
      required: [title, street, building, city]
      properties:
        title: { type: string, maxLength: 100 }
        street: { type: string, maxLength: 200 }
        building: { type: string, maxLength: 100 }
        floor: { type: string, maxLength: 50 }
        apartment: { type: string, maxLength: 50 }
        city: { type: string, maxLength: 100 }
        notes: { type: string, maxLength: 1000 }
        latitude: { type: number }
        longitude: { type: number }
        isDefault: { type: boolean }
    AddressResponseDto:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        title: { type: string }
        street: { type: string }
        building: { type: string }
        floor: { type: string, nullable: true }
        apartment: { type: string, nullable: true }
        city: { type: string }
        notes: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        isDefault: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    AddFavoriteDto:
      type: object
      required: [menuItemId]
      properties:
        menuItemId: { type: string, format: uuid }
    RedeemDto:
      type: object
      required: [rewardId]
      properties:
        rewardId: { type: string, enum: [free-delivery, discount-10, discount-25] }
    LoyaltyAccountResponseDto:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        pointsBalance: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    LoyaltyTransactionResponseDto:
      type: object
      properties:
        id: { type: string }
        delta: { type: integer }
        reason: { type: string }
        orderId: { type: string, nullable: true }
        rewardId: { type: string, nullable: true }
        createdAt: { type: string }
    CampaignDto:
      type: object
      required: [campaignName, title, body, type]
      properties:
        campaignName: { type: string, maxLength: 150 }
        title: { type: string, maxLength: 150 }
        body: { type: string, maxLength: 1000 }
        imageUrl: { type: string, maxLength: 2048 }
        type:
          type: string
          enum: [general, promotion, offer, new_product, category, order_created, order_confirmed, order_preparing, order_ready, order_out_for_delivery, order_delivered, order_cancelled, payment_success, payment_failed]
        targetAudience: { type: string, enum: [ALL, CUSTOMERS, GUESTS] }
        destinationRoute: { type: string, maxLength: 500 }
        entityId: { type: string, maxLength: 100 }
    ScheduleCampaignDto:
      allOf:
        - $ref: '#/components/schemas/CampaignDto'
        - type: object
          required: [scheduledAt]
          properties:
            scheduledAt: { type: string, format: date-time }
    AdminCampaignResponseDto:
      type: object
      properties:
        id: { type: string }
        campaignName: { type: string }
        title: { type: string }
        body: { type: string }
        imageUrl: { type: string, nullable: true }
        type: { type: string }
        targetAudience: { type: string }
        destinationRoute: { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, SCHEDULED, SENDING, SENT, FAILED] }
        isScheduled: { type: boolean }
        scheduledAt: { type: string, nullable: true }
        sentAt: { type: string, nullable: true }
        totalRecipients: { type: integer }
        deliveredCount: { type: integer }
        openedCount: { type: integer }
        clickRate: { type: number }
        createdAt: { type: string }
    UploadImageResponseDto:
      type: object
      properties:
        imageUrl: { type: string }
paths:
  /auth/register:
    post:
      summary: Register a new customer account
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterDto' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '409': { description: Email already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /auth/signup:
    post:
      summary: Alias of /auth/register (same handler)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterDto' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
  /auth/login:
    post:
      summary: Login (any role — customer or admin)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginDto' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '423': { description: Account locked (brute force), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /admin/auth/login:
    post:
      summary: Admin login (canonical) — requires role=ADMIN
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginDto' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '401': { description: Invalid credentials }
        '403': { description: Not an admin account }
        '423': { description: Account locked }
  /auth/admin/login:
    post:
      summary: Admin login (alias, same handler as /admin/auth/login)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginDto' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
  /auth/refresh:
    post:
      summary: Rotate a refresh token for a new access+refresh pair
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshDto' } } } }
      responses:
        '200': { description: OK }
        '401': { description: 'Invalid, expired, or reused refresh token' }
  /auth/logout:
    post:
      summary: Revoke one refresh token session
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/LogoutDto' } } } }
      responses: { '204': { description: No Content } }
  /auth/logout-all:
    post:
      summary: Revoke every active session for the caller
      responses: { '204': { description: No Content } }
  /auth/guest:
    post:
      summary: Create a guest session (real user, isGuest=true)
      security: []
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/GuestDto' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
  /users/me:
    get:
      summary: Get own profile
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponseDto' } } } }
    patch:
      summary: Update own profile
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProfileDto' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponseDto' } } } }
  /categories:
    get:
      summary: List active categories
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CategoryResponseDto' } } } } }
  /categories/{id}:
    get:
      summary: Get one category
      security: []
