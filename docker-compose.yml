# ---------------------------------------------------------------------------
# Kebda Zaman Backend — Phase 0 local stack (NestJS API + PostgreSQL 16)
# All configuration comes from the `.env` file — no hardcoded hosts or IPs.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: kz-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kz-net
    ports:
      # Exposed on the host only for local development / DB inspection.
      # Host port is configurable to avoid clashing with a pre-existing local Postgres.
      - '${DB_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    container_name: kz-api
    env_file:
      - .env
    environment:
      # The containerized API runs in production mode (structured JSON logs; the
      # pino-pretty dev transport is intentionally not shipped in the runtime image).
      NODE_ENV: production
      # Inside the compose network the API reaches Postgres by service name `db`.
      # This overrides DATABASE_URL from .env (which points at localhost for host runs).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kz-net
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/v1/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks:
  kz-net:
    driver: bridge
